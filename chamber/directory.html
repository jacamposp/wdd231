      property="og:description"
      content="Browse the Chamber of Commerce directory of local member businesses, with contact details, websites, and membership levels." />

    <meta property="og:url" content="https://jacamposp.github.io/wdd231/chamber/directory.html" />

    <meta
      name="description"
      content="Browse the Chamber of Commerce directory of local member businesses, with contact details, websites, and membership levels. WDD 231 project by Yoel Campos." />

    <link rel="icon" href="images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="stylesheet" href="styles/small.css" />
    <link rel="stylesheet" href="styles/larger.css" />

    <script src="scripts/members.js" defer></script>
    <script src="scripts/date.js" defer></script>
    <script src="scripts/navigation.js" defer></script>
  </head>
  <body>
    <header>
      <img src="images/logo.webp" alt="Chamber of commerce Heredia logo" width="24" height="24" />
      <span>Heredia Chamber of commerce</span>
      <button id="ham-btn" class="hamburger" aria-label="Toggle navigation" aria-expanded="false"></button>
    </header>
    <nav id="nav-bar" class="navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li class="current"><a href="directory.html" aria-current="page">Directory</a></li>
        <li><a href="#">Join</a></li>
        <li><a href="#">Discover</a></li>
      </ul>
    </nav>

    <main>
      <h1>Directory</h1>
      <div class="directory-btns">
        <button id="grid-btn" class="active">Grid</button>
        <button id="list-btn">List</button>
      </div>

      <div id="cards" class="grid">
        <section id="gold">
          <h2>Gold Members</h2>
          <div class="members"></div>
        </section>
        <section id="silver">
          <h2>Silver Members</h2>
          <div class="members"></div>
        </section>
        <section id="member">
          <h2>Members</h2>
          <div class="members"></div>
        </section>
      </div>

      <template id="card-template">
        <article class="card">
          <header class="card-header">
            <h3></h3>
            <p class="industry"></p>
          </header>
          <div class="card-body">
            <img src="https://placehold.co/100x100?text=Logo" alt="" width="100" height="100" loading="lazy" />
            <div class="card-info">
              <p><strong>ADDRESS:</strong> <span class="address"></span></p>
              <p><strong>PHONE:</strong> <span class="phone"></span></p>
              <p><strong>URL:</strong> <a class="website" target="_blank" rel="noopener"></a></p>
            </div>
          </div>
        </article>
      </template>
    </main>
    <footer>
      <div class="footer-info">
        <p><strong>Heredia Chamber of Commerce</strong></p>
        <p>Av 23b, La favorita Sur</p>
        <p>Heredia, Costa Rica</p>
        <a href="mailto:info@hcoc.com">info@hcoc.com</a>
        <a href="tel:+50688888888">8888-8888</a>
      </div>
      <div class="footer-social">
        <a href="https://www.facebook.com/joel.campos.739326" target="_blank" rel="noopener"
          ><img src="images/facebook.svg" alt="facebook icon" width="28" height="28"
        /></a>
        <a href="https://www.linkedin.com/in/joelcamposp/" target="_blank" rel="noopener"
          ><img src="images/linkedin.svg" alt="linkedin icon" width="28" height="28"
        /></a>
        <a href="https://twitter.com/joelcamposp" target="_blank" rel="noopener"
          ><img src="images/twitter.svg" alt="twitter icon" width="28" height="28"
        /></a>
      </div>
      <div class="footer-course">
        <p>WDD231 Class Project</p>
        <p>Joel Campos</p>
        <p>&copy; <span id="currentyear"></span> Heredia Chamber of Commerce</p>
        <p id="lastModified"></p>
      </div>
    </footer>
  </body>
</html>
